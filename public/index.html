<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nsfws.link</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --text: #f0f0f0;
    --sub: #888;
    --accent: #fff;
    --radius: 14px;
    --card-w: 240px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  header {
    margin-bottom: 48px;
  }

  header h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 900;
    letter-spacing: .08em;
    color: #fff;
    text-transform: uppercase;
  }

  header p {
    margin-top: 6px;
    font-size: .8rem;
    color: var(--sub);
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    max-width: 1100px;
    width: 100%;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: var(--card-w);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .18s ease, border-color .18s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #444;
  }

  .card img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .card-body {
    padding: 14px 12px 16px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .card-title {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #fff;
  }

  .card-domain {
    font-size: .7rem;
    color: var(--sub);
    letter-spacing: .06em;
  }

  footer {
    margin-top: 56px;
    font-size: .68rem;
    color: #333;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  @media (max-width: 540px) {
    :root { --card-w: 160px; }
    .card img { aspect-ratio: 3/4; }
  }
</style>
</head>
