<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nsfws.link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-logo {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .04em;
    color: #fff;
    text-transform: uppercase;
  }
  .nav-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  .nav-count {
    font-size: 12px;
    color: #555;
    font-weight: 500;
  }

  /* GRID */
  .grid {
    padding: 8px 28px 60px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 8px 16px 48px; }
    nav { padding: 16px 16px; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* CARD */
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1a1a;
    transition: transform .18s ease, opacity .18s ease;
    position: relative;
  }
  .card:not(.coming):hover { transform: translateY(-3px); }
  .card.coming { opacity: .45; cursor: default; pointer-events: none; }

  /* THUMBNAIL */
  .thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    background: #1c1c1c;
  }
  .thumb-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* CSS gradient fallback for each site */
  .thumb-mg-fun {
    background: linear-gradient(145deg, #1a0a2e 0%, #2d1465 40%, #1a0a2e 100%);
  }
  .thumb-mg-us {
    background: linear-gradient(145deg, #0d0d1f 0%, #1e1060 40%, #0d0d1f 100%);
  }
  .thumb-jabigod {
    background: linear-gradient(145deg, #060f0a 0%, #0a2416 40%, #06100a 100%);
  }
  .thumb-latina {
    background: linear-gradient(145deg, #1a0808 0%, #4a1020 40%, #1a0808 100%);
  }
  .thumb-blonde {
    background: linear-gradient(145deg, #111 0%, #1c1c1c 100%);
  }

  /* site brand centered in thumb */
  .thumb-brand {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .thumb-brand-name {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 800;
    letter-spacing: .02em;
    text-align: center;
    line-height: 1;
  }
  .thumb-brand-domain {
    font-size: clamp(.65rem, 1.5vw, .8rem);
    font-weight: 500;
    letter-spacing: .06em;
    opacity: .45;
  }

  /* accent colors per site */
  .c-purple { color: #a78bfa; }
  .c-purple2 { color: #818cf8; }
  .c-green  { color: #4ade80; }
  .c-red    { color: #f87171; }
  .c-muted  { color: #555; }

  /* CARD BODY */
  .card-body {
    padding: 12px 4px 14px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #f0f0f0;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 13px;
    color: #666;
    font-weight: 400;
  }

  /* coming soon overlay */
  .coming-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    color: #555;
    padding: 3px 8px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">nsfws.link</div>
  <div class="nav-dot"></div>
  <div class="nav-count">5 properties</div>
</nav>

<div class="grid">

  <!-- monkeygod.fun -->
  <a class="card" href="https://monkeygod.fun" target="_blank" rel="noopener">
    <div class="thumb thumb-mg-fun">
      <div class="thumb-brand">
        <div class="thumb-brand-name c-purple">MONKEYGOD</div>
        <div class="thumb-brand-domain">.fun</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">MonkeyGod</div>
      <div class="card-sub">monkeygod.fun</div>
    </div>
  </a>

  <!-- monkeygod.us -->
  <a class="card" href="https://monkeygod.us" target="_blank" rel="noopener">
    <div class="thumb thumb-mg-us">
      <div class="thumb-brand">
        <div class="thumb-brand-name c-purple2">MONKEYGOD</div>
        <div class="thumb-brand-domain">.us</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">MonkeyGod US</div>
      <div class="card-sub">monkeygod.us</div>
    </div>
  </a>

  <!-- jabigod.xyz -->
  <a class="card" href="https://jabigod.xyz" target="_blank" rel="noopener">
    <div class="thumb thumb-jabigod">
      <div class="thumb-brand">
        <div class="thumb-brand-name c-green">JABIGOD</div>
        <div class="thumb-brand-domain">.xyz</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">JabiGod</div>
      <div class="card-sub">jabigod.xyz</div>
    </div>
  </a>

  <!-- latinagod.xyz -->
  <a class="card" href="https://latinagod.xyz" target="_blank" rel="noopener">
    <div class="thumb thumb-latina">
      <div class="thumb-brand">
        <div class="thumb-brand-name c-red">LATINAGOD</div>
        <div class="thumb-brand-domain">.xyz</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">LatinaGod</div>
      <div class="card-sub">latinagod.xyz</div>
    </div>
  </a>

  <!-- blondebaddies.xyz — coming soon -->
  <div class="card coming">
    <div class="thumb thumb-blonde">
      <div class="thumb-brand">
        <div class="thumb-brand-name c-muted">BLONDE BADDIES</div>
        <div class="thumb-brand-domain">.xyz</div>
      </div>
    </div>
    <div class="coming-badge">Soon</div>
    <div class="card-body">
      <div class="card-title" style="color:#444;">BlondeBaddies</div>
      <div class="card-sub">Coming soon</div>
    </div>
  </div>

</div>

</body>
</html>
